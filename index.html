<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐧 Abyss AI - بازی کامل</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            padding: 10px;
        }
        .game-wrapper {
            max-width: 750px;
            width: 100%;
            background: #16213e;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 2px solid #0f3460;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px 12px 8px;
            border-bottom: 1px solid #0f3460;
        }
        .title {
            font-size: 22px;
            font-weight: bold;
            color: #e0e0e0;
            letter-spacing: 2px;
        }
        .title span {
            color: #4fc3f7;
        }
        .controls-hint {
            color: #4a5a6a;
            font-size: 12px;
        }
        #gameCanvas {
            width: 100%;
            height: 480px;
            background: #1a3a5c;
            border-radius: 16px;
            display: block;
            border: 2px solid #0f3460;
            cursor: pointer;
            image-rendering: pixelated;
            touch-action: none;
            margin: 12px 0;
        }
        .status {
            padding: 10px 14px;
            background: #0a0e1a;
            border-radius: 10px;
            margin: 8px 0;
            min-height: 44px;
            font-size: 14px;
            color: #c8d8e0;
            text-align: center;
            border: 1px solid #0f3460;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .status .emoji {
            font-size: 20px;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px;
            margin: 4px 0;
        }
        .stats-left {
            display: flex;
            gap: 20px;
            font-size: 16px;
            font-weight: bold;
        }
        .stats-left .fish-stat {
            color: #4fc3f7;
        }
        .stats-left .energy-stat {
            color: #f7dc6f;
        }
        .energy-bar-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 140px;
        }
        .energy-bar {
            flex: 1;
            height: 10px;
            background: #0a0e1a;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #1a2a4a;
        }
        .energy-bar-fill {
            height: 100%;
            width: 100%;
            background: #4fc3f7;
            border-radius: 6px;
            transition: width 0.3s;
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin: 8px 0;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-fish {
            background: #0f3460;
            color: #4fc3f7;
            border: 1px solid #4fc3f7;
        }
        .btn-fish:hover {
            background: #1a4a7a;
        }
        .btn-feed {
            background: #2d2d2d;
            color: #f7dc6f;
            border: 1px solid #f7dc6f;
        }
        .btn-feed:hover {
            background: #3d3d3d;
        }
        .btn-fish.active {
            background: #4fc3f7;
            color: #0a0e1a;
        }
        .hint {
            text-align: center;
            font-size: 11px;
            color: #4a5a6a;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="header">
        <div class="title">🐧 <span>ABYSS</span> AI</div>
        <div class="controls-hint">⌨️ ↑ ↓ ← →</div>
    </div>

    <canvas id="gameCanvas" width="710" height="480"></canvas>

    <div class="status" id="status">
        <span class="emoji">🎣</span>
        <span id="statusText">به رودخانه برس و ماهی‌گیری کن!</span>
    </div>

    <div class="stats">
        <div class="stats-left">
            <span class="fish-stat">🐟 <span id="fishCount">0</span></span>
            <span class="energy-stat">⚡ <span id="energyDisplay">10</span></span>
        </div>
        <div class="energy-bar-wrap">
            <span style="font-size:12px;color:#4a5a6a;">انرژی</span>
            <div class="energy-bar">
                <div class="energy-bar-fill" id="energyBar" style="width:100%"></div>
            </div>
        </div>
    </div>

    <div class="buttons">
        <button class="btn btn-fish" id="fishBtn">🎣 چوب بینداز</button>
        <button class="btn btn-feed" id="feedBtn">🐧 غذا دادن</button>
    </div>

    <div class="hint">👆 روی رودخانه کلیک کن تا ماهی بگیری | با جهت‌ها حرکت کن</div>
</div>

<script>
    // ============================================================
    // ABYSS AI - بازی کامل
    // ============================================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 710,
        H = 480;

    // ===== وضعیت بازی =====
    const state = {
        // پنگوئن
        penguin: {
            x: 355,
            y: 420,
            width: 40,
            height: 48,
            direction: 'down', // down, up, left, right
            frame: 0,
            frameTimer: 0,
            moving: false,
            speed: 1.2,
            facing: 'down'
        },
        fish: {
            count: 0,
            energy: 10,
            maxEnergy: 10
        },
        fishing: {
            active: false,
            waiting: false,
            bobberX: 0,
            bobberY: 0,
            fishX: 0,
            fishY: 0,
            fishVisible: false,
            fishCaught: false,
            exclamationTimer: 0,
            catchTimer: 0,
            stars: [],
            rodVisible: false
        },
        keys: {},
        gameTime: 0,
        isOnBridge: false,
        isNearWater: false
    };

    // ===== تصاویر =====
    const images = {};
    const imageList = [
        // پنگوئن از جلو
        'pang', 'pangchap', 'pangrast',
        // پنگوئن از پشت
        'pangposht', 'pangposhtchap', 'pangposhtrast',
        // پنگوئن نیم‌رخ راست
        'pangnimrast', 'pangnimrastjolo', 'pangnimrastaghab',
        // پنگوئن نیم‌رخ چپ
        'pangnimchap', 'pangnimchapjoli', 'pangnimchapaghab',
        // اشیاء
        'choob', 'mahi', 'rood', 'pol', 'paszamine'
    ];

    let loadedCount = 0;
    const totalImages = imageList.length;

    function loadImages() {
        imageList.forEach(name => {
            const img = new Image();
            img.src = `assets/images/${name}.png`;
            img.onload = () => {
                loadedCount++;
                if (loadedCount === totalImages) startGame();
            };
            img.onerror = () => {
                console.warn(`⚠️ ${name}.png پیدا نشد`);
                loadedCount++;
                if (loadedCount === totalImages) startGame();
            };
            images[name] = img;
        });
    }

    // ===== شروع بازی =====
    function startGame() {
        console.log('✅ همه تصاویر بارگذاری شدند!');
        document.getElementById('statusText').textContent = 'به رودخانه برس و ماهی‌گیری کن!';
        gameLoop();
        setupEventListeners();
    }

    // ===== رویدادها =====
    function setupEventListeners() {
        document.addEventListener('keydown', (e) => {
            state.keys[e.key] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', (e) => {
            state.keys[e.key] = false;
        });

        canvas.addEventListener('click', handleCanvasClick);

        document.getElementById('fishBtn').addEventListener('click', () => {
            if (!state.fishing.active && !state.fishing.waiting) {
                startFishing();
            } else {
                document.getElementById('statusText').textContent = '⏳ صبر کن!';
            }
        });

        document.getElementById('feedBtn').addEventListener('click', feedPenguin);
    }

    // ===== کلیک روی Canvas =====
    function handleCanvasClick(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left) * scaleX;
        const my = (e.clientY - rect.top) * scaleY;

        // اگر ماهی قابل رویت است و در حال انتظار
        if (state.fishing.fishVisible && state.fishing.waiting) {
            const dist = Math.hypot(mx - state.fishing.fishX, my - state.fishing.fishY);
            if (dist < 50) {
                catchFish();
                return;
            } else {
                document.getElementById('statusText').textContent = '👆 نزدیک‌تر به ماهی کلیک کن!';
                setTimeout(() => {
                    if (state.fishing.waiting) {
                        document.getElementById('statusText').textContent = '🐟 ماهی پیدا شد! کلیک کن!';
                    }
                }, 1000);
                return;
            }
        }

        // اگر نزدیک آب است و چوب فعال نیست
        if (state.isNearWater && !state.fishing.active && !state.fishing.waiting) {
            startFishing();
        }
    }

    // ===== شروع ماهی‌گیری =====
    function startFishing() {
        if (state.fishing.active || state.fishing.waiting) return;
        if (!state.isNearWater) {
            document.getElementById('statusText').textContent = '❌ به رودخانه نزدیک شو!';
            return;
        }
        if (state.fish.energy < 1) {
            document.getElementById('statusText').textContent = '❌ انرژی کافی نیست!';
            return;
        }

        state.fish.energy--;
        updateUI();
        state.fishing.active = true;
        state.fishing.rodVisible = true;
        state.fishing.bobberX = state.penguin.x + 20;
        state.fishing.bobberY = state.penguin.y + 10;

        document.getElementById('statusText').textContent = '🎣 چوب به آب افتاد...';
        document.getElementById('fishBtn').classList.add('active');

        const waitTime = 2000 + Math.random() * 8000;
        setTimeout(() => {
            if (state.fishing.active) {
                showFish();
            }
        }, waitTime);
    }

    // ===== نمایش ماهی =====
    function showFish() {
        if (!state.fishing.active) return;
        state.fishing.active = false;
        state.fishing.waiting = true;
        state.fishing.fishVisible = true;
        state.fishing.fishX = 120 + Math.random() * 450;
        state.fishing.fishY = 200 + Math.random() * 100;

        // علامت تعجب بالای پنگوئن
        state.fishing.exclamationTimer = 60;

        document.getElementById('statusText').textContent = '🐟 ماهی پیدا شد! کلیک کن! (۳ ثانیه)';
        document.getElementById('fishBtn').classList.remove('active');

        // تایمر فرار ماهی
        setTimeout(() => {
            if (state.fishing.fishVisible && state.fishing.waiting) {
                fishEscaped();
            }
        }, 3000);
    }

    // ===== گرفتن ماهی =====
    function catchFish() {
        if (!state.fishing.waiting || !state.fishing.fishVisible) return;

        state.fishing.waiting = false;
        state.fishing.fishVisible = false;
        state.fishing.fishCaught = true;
        state.fishing.rodVisible = false;

        // افزایش ماهی
        state.fish.count++;
        updateUI();

        // ستاره‌ها
        for (let i = 0; i < 20; i++) {
            state.fishing.stars.push({
                x: state.penguin.x + (Math.random() - 0.5) * 60,
                y: state.penguin.y - 20 + (Math.random() - 0.5) * 40,
                vx: (Math.random() - 0.5) * 4,
                vy: -2 - Math.random() * 3,
                life: 30 + Math.random() * 30,
                maxLife: 60,
                size: 3 + Math.random() * 5
            });
        }

        document.getElementById('statusText').textContent = '🎉 ماهی گرفتی! +۱ 🐟';
        state.fishing.active = false;
        state.fishing.waiting = false;
        document.getElementById('fishBtn').classList.remove('active');

        // ماهی دوباره بعد از ۵ ثانیه
        setTimeout(() => {
            state.fishing.fishCaught = false;
        }, 5000);
    }

    // ===== ماهی فرار کرد =====
    function fishEscaped() {
        if (!state.fishing.waiting) return;
        state.fishing.waiting = false;
        state.fishing.fishVisible = false;
        state.fishing.active = false;
        state.fishing.rodVisible = false;
        document.getElementById('statusText').textContent = '😔 ماهی فرار کرد! دوباره امتحان کن.';
        document.getElementById('fishBtn').classList.remove('active');
    }

    // ===== غذا دادن به پنگوئن =====
    function feedPenguin() {
        if (state.fish.count < 10) {
            document.getElementById('statusText').textContent = `❌ به ۱۰ ماهی نیاز داری! (داری ${state.fish.count})`;
            return;
        }
        if (state.fish.energy >= state.fish.maxEnergy) {
            document.getElementById('statusText').textContent = '✅ انرژی کامل است!';
            return;
        }
        state.fish.count -= 10;
        state.fish.energy = Math.min(state.fish.energy + 5, state.fish.maxEnergy);
        updateUI();
        document.getElementById('statusText').textContent = '🐧 پنگوئن خوشحال شد! +۵ انرژی ❤️';
    }

    // ===== به‌روزرسانی UI =====
    function updateUI() {
        document.getElementById('fishCount').textContent = state.fish.count;
        document.getElementById('energyDisplay').textContent = state.fish.energy;
        const pct = (state.fish.energy / state.fish.maxEnergy) * 100;
        document.getElementById('energyBar').style.width = pct + '%';
        document.getElementById('energyBar').style.background = pct > 50 ? '#4fc3f7' : pct > 25 ? '#f7dc6f' : '#e74c3c';
    }

    // ===== حلقه اصلی =====
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ===== به‌روزرسانی =====
    function update() {
        state.gameTime++;

        // ===== حرکت پنگوئن =====
        let dx = 0,
            dy = 0;
        let newDir = state.penguin.direction;

        if (state.keys['ArrowUp']) { dy = -1;
            newDir = 'up'; } else if (state.keys['ArrowDown']) { dy = 1;
            newDir = 'down'; } else if (state.keys['ArrowLeft']) { dx = -1;
            newDir = 'left'; } else if (state.keys['ArrowRight']) { dx = 1;
            newDir = 'right'; }

        // اگر پنگوئن روی پل است یا نزدیک آب
        const isOnBridge = state.penguin.x > 300 && state.penguin.x < 410 &&
            state.penguin.y > 220 && state.penguin.y < 260;

        if (dx !== 0 || dy !== 0) {
            state.penguin.moving = true;
            state.penguin.direction = newDir;
            state.penguin.facing = newDir;

            // سرعت
            const speed = state.penguin.speed;
            let newX = state.penguin.x + dx * speed;
            let newY = state.penguin.y + dy * speed;

            // محدودیت‌ها
            const margin = 30;
            newX = Math.max(margin, Math.min(W - margin, newX));
            newY = Math.max(60, Math.min(H - 30, newY));

            // جلوگیری از رد شدن از رودخانه (اگر روی پل نیست)
            if (!isOnBridge) {
                // رودخانه عمودی در وسط
                const riverLeft = 300,
                    riverRight = 410;
                const riverTop = 150,
                    riverBottom = 320;

                // اگر در محدوده رودخانه است
                if (newX > riverLeft && newX < riverRight &&
                    newY > riverTop && newY < riverBottom) {
                    // اگر از چپ می‌آید
                    if (state.penguin.x <= riverLeft) {
                        newX = riverLeft - 5;
                    }
                    // اگر از راست می‌آید
                    else if (state.penguin.x >= riverRight) {
                        newX = riverRight + 5;
                    }
                    // اگر از بالا می‌آید
                    else if (state.penguin.y <= riverTop) {
                        newY = riverTop - 5;
                    }
                    // اگر از پایین می‌آید
                    else if (state.penguin.y >= riverBottom) {
                        newY = riverBottom + 5;
                    }
                }
            }

            state.penguin.x = newX;
            state.penguin.y = newY;

            // انیمیشن
            state.penguin.frameTimer++;
            if (state.penguin.frameTimer > 10) {
                state.penguin.frameTimer = 0;
                state.penguin.frame = (state.penguin.frame + 1) % 3;
            }

            // بررسی نزدیکی به رودخانه
            state.isNearWater = state.penguin.y > 200 && state.penguin.y < 280 &&
                state.penguin.x > 200 && state.penguin.x < 510;
        } else {
            state.penguin.moving = false;
            state.penguin.frame = 0;
            state.penguin.frameTimer = 0;
        }

        // ===== ستاره‌ها =====
        state.fishing.stars = state.fishing.stars.filter(s => {
            s.x += s.vx;
            s.y += s.vy;
            s.vy += 0.05;
            s.life--;
            return s.life > 0;
        });

        // ===== علامت تعجب =====
        if (state.fishing.exclamationTimer > 0) {
            state.fishing.exclamationTimer--;
        }
    }

    // ===== رسم =====
    function draw() {
        ctx.clearRect(0, 0, W, H);

        // ===== پس‌زمینه =====
        drawBackground();

        // ===== رودخانه =====
        drawRiver();

        // ===== پل =====
        drawBridge();

        // ===== چوب ماهی‌گیری =====
        drawRod();

        // ===== ماهی =====
        drawFish();

        // ===== پنگوئن =====
        drawPenguin();

        // ===== علامت تعجب =====
        drawExclamation();

        // ===== ستاره‌ها =====
        drawStars();

        // ===== اطلاعات روی صفحه =====
        drawHUD();
    }

    // ===== رسم پس‌زمینه =====
    function drawBackground() {
        if (images['paszamine']) {
            ctx.drawImage(images['paszamine'], 0, 0, W, H);
        } else {
            // پس‌زمینه پیش‌فرض
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0a1a2e');
            grad.addColorStop(0.4, '#1a3a5a');
            grad.addColorStop(0.7, '#2a5a7a');
            grad.addColorStop(1, '#1a3a2a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // خورشید
            ctx.fillStyle = '#f7dc6f';
            ctx.beginPath();
            ctx.arc(640, 50, 35, 0, Math.PI * 2);
            ctx.fill();
            // پرتوها
            for (let i = 0; i < 12; i++) {
                const angle = i * Math.PI / 6 + state.gameTime * 0.001;
                ctx.fillStyle = 'rgba(247,220,111,0.1)';
                ctx.fillRect(640 + Math.cos(angle) * 50 - 3, 50 + Math.sin(angle) * 50 - 3, 6, 6);
            }
        }
    }

    // ===== رسم رودخانه =====
    function drawRiver() {
        if (images['rood']) {
            ctx.drawImage(images['rood'], 300, 140, 110, 200);
        } else {
            ctx.fillStyle = '#1a6a8a';
            ctx.fillRect(310, 130, 90, 220);
            ctx.fillStyle = 'rgba(10, 42, 58, 0.3)';
            ctx.fillRect(320, 130, 70, 220);
            // موج‌ها
            const time = state.gameTime * 0.02;
            for (let i = 0; i < 8; i++) {
                const y = 150 + i * 25 + Math.sin(time + i) * 5;
                ctx.fillStyle = `rgba(255,255,255,${0.03 + Math.sin(time + i) * 0.02})`;
                ctx.fillRect(320 + Math.sin(time * 0.5 + i) * 15, y, 50, 4);
            }
        }
    }

    // ===== رسم پل =====
    function drawBridge() {
        if (images['pol']) {
            ctx.drawImage(images['pol'], 320, 240, 60, 30);
        } else {
            ctx.fillStyle = '#6d4c2a';
            ctx.fillRect(325, 245, 50, 16);
            ctx.fillStyle = '#8B6914';
            for (let i = 0; i < 6; i++) {
                ctx.fillRect(330 + i * 8, 248, 3, 10);
            }
        }
    }

    // ===== رسم چوب ماهی‌گیری =====
    function drawRod() {
        if (!state.fishing.rodVisible && !state.fishing.active && !state.fishing.waiting) return;

        const px = state.penguin.x;
        const py = state.penguin.y;

        if (images['choob']) {
            // چوب در دست پنگوئن
            const rodX = px + 25;
            const rodY = py - 15;
            ctx.save();
            ctx.translate(rodX, rodY);
            if (state.fishing.active || state.fishing.waiting) {
                ctx.rotate(0.3);
            }
            ctx.drawImage(images['choob'], -10, -10, 20, 40);
            ctx.restore();

            // خط ماهی‌گیری
            if (state.fishing.active || state.fishing.waiting) {
                ctx.beginPath();
                ctx.moveTo(px + 30, py - 5);
                ctx.lineTo(state.fishing.bobberX, state.fishing.bobberY);
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // چوب‌پران
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.arc(state.fishing.bobberX, state.fishing.bobberY, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(state.fishing.bobberX - 1, state.fishing.bobberY - 2, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        } else {
            // شکل جایگزین
            ctx.fillStyle = '#6d4c2a';
            ctx.fillRect(px + 20, py - 20, 4, 30);
            if (state.fishing.active || state.fishing.waiting) {
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(px + 22, py - 5, 1, 30);
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.arc(state.fishing.bobberX, state.fishing.bobberY, 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    // ===== رسم ماهی =====
    function drawFish() {
        if (!state.fishing.fishVisible) return;

        const fx = state.fishing.fishX;
        const fy = state.fishing.fishY;

        if (images['mahi']) {
            // انیمیشن شناور
            const bob = Math.sin(state.gameTime * 0.05) * 3;
            ctx.drawImage(images['mahi'], fx - 20, fy - 12 + bob, 40, 24);
            // درخشش
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.beginPath();
            ctx.arc(fx + 5, fy - 5 + bob, 15, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = '#4a8a5a';
            ctx.fillRect(fx - 15, fy - 8, 30, 16);
            ctx.fillStyle = 'white';
            ctx.fillRect(fx + 6, fy - 6, 4, 4);
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(fx + 7, fy - 5, 2, 2);
        }
    }

    // ===== رسم پنگوئن =====
    function drawPenguin() {
        const px = state.penguin.x;
        const py = state.penguin.y;
        const dir = state.penguin.direction;
        const moving = state.penguin.moving;
        const frame = state.penguin.frame;

        let imgName = '';

        // انتخاب تصویر بر اساس جهت و فریم
        if (dir === 'down') {
            if (!moving) imgName = 'pang';
            else if (frame === 0) imgName = 'pang';
            else if (frame === 1) imgName = 'pangchap';
            else imgName = 'pangrast';
        } else if (dir === 'up') {
            if (!moving) imgName = 'pangposht';
            else if (frame === 0) imgName = 'pangposht';
            else if (frame === 1) imgName = 'pangposhtchap';
            else imgName = 'pangposhtrast';
        } else if (dir === 'right') {
            if (!moving) imgName = 'pangnimrast';
            else if (frame === 0) imgName = 'pangnimrast';
            else if (frame === 1) imgName = 'pangnimrastjolo';
            else imgName = 'pangnimrastaghab';
        } else if (dir === 'left') {
            if (!moving) imgName = 'pangnimchap';
            else if (frame === 0) imgName = 'pangnimchap';
            else if (frame === 1) imgName = 'pangnimchapjoli';
            else imgName = 'pangnimchapaghab';
        }

        const img = images[imgName];
        if (img) {
            const w = state.penguin.width;
            const h = state.penguin.height;
            ctx.drawImage(img, px - w / 2, py - h, w, h);
        } else {
            // شکل جایگزین
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(px - 12, py - 28, 24, 30);
            ctx.fillStyle = '#e8e8e8';
            ctx.fillRect(px - 8, py - 22, 16, 20);
            ctx.fillStyle = '#e67e22';
            ctx.fillRect(px - 3, py - 12, 6, 4);
            // چشم‌ها
            ctx.fillStyle = 'white';
            ctx.fillRect(px - 8, py - 26, 4, 4);
            ctx.fillRect(px + 4, py - 26, 4, 4);
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(px - 7, py - 25, 2, 2);
            ctx.fillRect(px + 5, py - 25, 2, 2);
            // پاها
            ctx.fillStyle = '#e67e22';
            ctx.fillRect(px - 8, py + 2, 6, 4);
            ctx.fillRect(px + 2, py + 2, 6, 4);
        }
    }

    // ===== رسم علامت تعجب =====
    function drawExclamation() {
        if (state.fishing.exclamationTimer <= 0) return;

        const px = state.penguin.x;
        const py = state.penguin.y;
        const alpha = state.fishing.exclamationTimer / 60;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#e74c3c';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('❗', px, py - 55);
        ctx.restore();
    }

    // ===== رسم ستاره‌ها =====
    function drawStars() {
        state.fishing.stars.forEach(s => {
            const alpha = s.life / s.maxLife;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#f7dc6f';
            // ستاره ۴ پر
            const size = s.size;
            ctx.fillRect(s.x - size / 2, s.y - size / 6, size, size / 3);
            ctx.fillRect(s.x - size / 6, s.y - size / 2, size / 3, size);
            ctx.restore();
        });
    }

    // ===== HUD روی صفحه =====
    function drawHUD() {
        // نمایش موقعیت نزدیک آب
        if (state.isNearWater) {
            ctx.fillStyle = 'rgba(79, 195, 247, 0.1)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(79, 195, 247, 0.3)';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🌊 نزدیک رودخانه', W / 2, 20);
        }

        // نمایش انرژی روی پنگوئن
        const px = state.penguin.x;
        const py = state.penguin.y;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(px - 20, py - 50, 40, 6);
        const pct = state.fish.energy / state.fish.maxEnergy;
        ctx.fillStyle = pct > 0.5 ? '#4fc3f7' : pct > 0.25 ? '#f7dc6f' : '#e74c3c';
        ctx.fillRect(px - 18, py - 48, 36 * pct, 4);
    }

    // ===== شروع =====
    loadImages();
    updateUI();
    console.log('🐧 Abyss AI - بازی کامل راه‌اندازی شد!');
    console.log('🎮 با جهت‌ها حرکت کن و به رودخانه برس!');
</script>

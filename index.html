<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐧 Abyss AI</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0e1a;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px}
        .game-wrapper{max-width:700px;width:100%;background:#16213e;border-radius:20px;padding:20px;border:2px solid #0f3460}
        #gameCanvas{width:100%;height:450px;background:#1a3a5c;border-radius:16px;display:block;border:2px solid #0f3460;cursor:pointer}
        .status{padding:8px;background:#0a0e1a;border-radius:8px;margin:8px 0;color:#c8d8e0;text-align:center}
        .stats{display:flex;justify-content:space-around;margin:6px 0;font-size:16px;font-weight:bold}
        .stats .fish-stat{color:#4fc3f7}.stats .energy-stat{color:#f7dc6f}
        .energy-bar{width:100%;height:10px;background:#0a0e1a;border-radius:4px;overflow:hidden;margin:6px 0}
        .energy-bar-fill{height:100%;width:100%;background:#4fc3f7;border-radius:4px;transition:width 0.3s}
        .buttons{display:flex;gap:10px;margin:8px 0}
        .btn{flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer}
        .btn-fish{background:#0f3460;color:#4fc3f7;border:1px solid #4fc3f7}
        .btn-feed{background:#2d2d2d;color:#f7dc6f;border:1px solid #f7dc6f}
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="title" style="text-align:center;font-size:20px;font-weight:bold;color:#e0e0e0;margin-bottom:12px;">🐧 <span style="color:#4fc3f7;">ABYSS</span> AI</div>
    <canvas id="gameCanvas" width="660" height="450"></canvas>
    <div class="status" id="status">🎣 برای شروع، دکمه رو بزن!</div>
    <div class="stats">
        <span class="fish-stat">🐟 <span id="fishCount">0</span></span>
        <span class="energy-stat">⚡ <span id="energyDisplay">10</span>/10</span>
    </div>
    <div class="energy-bar"><div class="energy-bar-fill" id="energyBar" style="width:100%;"></div></div>
    <div class="buttons">
        <button class="btn btn-fish" id="fishBtn">🎣 چوب بینداز!</button>
        <button class="btn btn-feed" id="feedBtn">🐧 غذا دادن</button>
    </div>
</div>
<script src="game.js"></script>
</body>
</html>

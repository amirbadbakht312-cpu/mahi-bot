<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🐧 پنگوئن ماهی‌گیر (سبک Stardew Valley)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-touch-callout: none; }
        body { background: #0a2a4a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        .game-wrapper { background: #1a4a6a; padding: 16px; border-radius: 30px; box-shadow: 0 20px 30px rgba(0,0,0,0.6); }
        canvas { display: block; margin: 0 auto; border-radius: 18px; background: #87CEEB; cursor: pointer; width: 100%; max-width: 800px; height: auto; aspect-ratio: 800 / 500; touch-action: none; }
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 14px; padding: 0 4px; }
        .controls button { background: #f0c050; border: none; padding: 10px 18px; border-radius: 40px; font-size: 20px; font-weight: bold; color: #1a3a4a; box-shadow: 0 5px 0 #b08020; transition: 0.05s linear; cursor: pointer; border: 2px solid #ffe080; flex: 1 0 60px; touch-action: none; min-width: 56px; }
        .controls button:active { transform: translateY(5px); box-shadow: 0 1px 0 #b08020; }
        .controls button:disabled { opacity: 0.5; transform: translateY(4px); box-shadow: 0 2px 0 #b08020; pointer-events: none; }
        .info { color: #ffe0a0; text-align: center; margin-top: 10px; font-size: 18px; text-shadow: 0 2px 0 #0a1a2a; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .info span { background: #0a2a3a; padding: 6px 18px; border-radius: 30px; display: inline-block; }
        #miniGameOverlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; border-radius: 18px; }
        #miniGameOverlay.active { display: flex; }
        .mini-game-container { background: #2a4a5a; padding: 20px; border-radius: 20px; border: 4px solid #f0c050; text-align: center; }
        .mini-game-container canvas { width: 200px; height: 300px; border-radius: 10px; background: #1a3a4a; }
        .mini-game-container button { margin-top: 10px; background: #f0c050; border: none; padding: 8px 20px; border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer; }
        @media (max-width: 500px) { .controls button { font-size: 16px; padding: 8px 10px; flex: 1 0 44px; min-width: 44px; } }
    </style>
</head>
<body>
<div class="game-wrapper" style="position: relative;">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="miniGameOverlay">
        <div class="mini-game-container">
            <canvas id="miniGameCanvas" width="200" height="300"></canvas>
            <button id="miniGameBtn">⬆ نگه دار</button>
        </div>
    </div>
    <div class="controls">
        <button id="leftBtn">⬅</button>
        <button id="rightBtn">➡</button>
        <button id="upBtn">⬆</button>
        <button id="downBtn">⬇</button>
        <button id="fishBtn">🎣</button>
    </div>
    <div class="info">
        <span id="statusDisplay">🌊 آماده</span>
        <span id="fishCount">🐟 0</span>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const miniCanvas = document.getElementById('miniGameCanvas');
        const miniCtx = miniCanvas.getContext('2d');
        const overlay = document.getElementById('miniGameOverlay');
        const statusDisplay = document.getElementById('statusDisplay');
        const fishCountSpan = document.getElementById('fishCount');

        // ---------- بارگذاری تصاویر ----------
        const images = {};

        function loadImage(name, src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = src;
                img.onload = () => { images[name] = img; resolve(); };
                img.onerror = () => {
                    console.warn(`❌ تصویر ${name} بار نشد.`);
                    const c = document.createElement('canvas');
                    c.width = 80; c.height = 80;
                    const cx = c.getContext('2d');
                    cx.fillStyle = '#aaccdd';
                    cx.fillRect(0,0,80,80);
                    cx.fillStyle = '#000';
                    cx.font = '10px sans-serif';
                    cx.fillText(name, 8, 45);
                    images[name] = c;
                    resolve();
                };
            });
        }

        const imageList = [
            ['choob_amade', 'choob_amade.jpeg'],
            ['choob_partab', 'choob_partab.jpeg'],
            ['choob_too_ab', 'choob_too_ab.jpeg'],
            ['mahi', 'mahi.jpeg'],
            ['pangghadamjolo1', 'pangghadamjolo1.jpeg'],
            ['pangghadamjolo2', 'pangghadamjolo2.jpeg'],
            ['pangghadamposht1', 'pangghadamposht1.jpeg'],
            ['pangghadamposht2', 'pangghadamposht2.jpeg'],
            ['pangghadamposht3', 'pangghadamposht3.jpeg'],
            ['pangghadamrast2', 'pangghadamrast2.jpeg'],
            ['pangghdamrast1', 'pangghdamrast1.jpeg'],
            ['pangistade2', 'pangistade2.jpeg'],
            ['pangnafasdam', 'pangnafasdam.jpeg'],
            ['panhistade1', 'panhistade1.jpeg'],
            ['pannafasbazdam', 'pannafasbazdam.jpeg'],
            ['paszamine', 'paszamine.jpeg'],
            ['rood_2', 'rood_2.jpeg'],
            ['roood_1', 'roood_1.jpeg'],
            ['toop', 'toop.jpeg']
        ];

        // ---------- متغیرهای بازی ----------
        const GROUND_Y = 440;
        const RIVER_X = 200;
        const RIVER_WIDTH = 120;
        const RIVER_RECT = { x: RIVER_X, y: 0, w: RIVER_WIDTH, h: 500 };

        let penguin = {
            x: 400, y: GROUND_Y - 60,
            w: 50, h: 70,
            dir: 'right',
            state: 'idle',
            frame: 0,
            frameTimer: 0,
            breath: 0,
            idleTimer: 0,
            fishCount: 0,
            holdingFish: false,
            rodState: 'idle',
            castTimer: 0,
            rodOffsets: {
                idle: { x: 14, y: -18 },
                walk: { 0: { x: 16, y: -20 }, 1: { x: 18, y: -22 }, 2: { x: 14, y: -18 }, 3: { x: 12, y: -16 } },
                walkBack: { 0: { x: 10, y: -22 }, 1: { x: 12, y: -24 }, 2: { x: 10, y: -20 }, 3: { x: 8, y: -18 } },
                walkFront: { 0: { x: 18, y: -20 }, 1: { x: 20, y: -22 }, 2: { x: 16, y: -18 }, 3: { x: 14, y: -16 } },
                fishing: { x: 14, y: -18 },
                fishHold: { x: 14, y: -18 }
            },
            fishOffsets: {
                right: { x: 12, y: -18 },
                left: { x: -42, y: -18 }
            },
            breathOffset: 0,
            shadowY: 0
        };

        const keys = { left: false, right: false, up: false, down: false };
        let fishPressed = false;
        let animId = null;
        let riverOffset = 0;
        let isFishing = false;
        let bobberX = 0, bobberY = 0;
        let bobberWave = 0;
        let fishingState = 'idle'; // idle, casting, waiting, bite, miniGame
        let miniGameActive = false;
        let miniGameFishY = 100;
        let miniGameBarY = 150;
        let miniGameSpeed = 1.5;
        let miniGameDirection = 1;
        let miniGameScore = 0;
        let miniGameMaxScore = 0;
        let miniGameFishSize = 20;
        let miniGameTimer = 0;
        let miniGameSuccess = false;

        // ---------- توابع کمکی ----------
        function drawImageAspect(img, x, y, targetW, targetH) {
            if (!img) return;
            const aspect = img.width / img.height;
            let drawW = targetW, drawH = targetH;
            if (aspect > 1) {
                drawH = targetW / aspect;
            } else {
                drawW = targetH * aspect;
            }
            const offsetX = (targetW - drawW) / 2;
            const offsetY = (targetH - drawH) / 2;
            ctx.drawImage(img, x + offsetX, y + offsetY, drawW, drawH);
        }

        // ---------- توابع رسم ----------
        function drawBackground() {
            if (images.paszamine) {
                ctx.drawImage(images.paszamine, 0, 0, 800, 500);
            } else {
                ctx.fillStyle = '#87CEEB';
                ctx.fillRect(0, 0, 800, 500);
                ctx.fillStyle = '#5a9a4a';
                ctx.fillRect(0, GROUND_Y, 800, 60);
            }
            // سایه زیر پنگوئن
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 20;
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath();
            ctx.ellipse(penguin.x, GROUND_Y + 5, 30, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawRiver() {
            riverOffset += 0.5;
            const shift = Math.sin(riverOffset / 25) * 3;
            const phase = Math.floor(riverOffset / 30) % 4;
            let riverImg = null;
            if (phase < 2) riverImg = images.roood_1;
            else riverImg = images.rood_2;
            
            if (riverImg) {
                ctx.save();
                ctx.drawImage(riverImg, RIVER_X, shift, RIVER_WIDTH, 500);
                ctx.globalAlpha = 0.3;
                ctx.drawImage(riverImg, RIVER_X + 2, -shift * 0.5, RIVER_WIDTH, 500);
                ctx.restore();
            } else {
                ctx.fillStyle = '#2a7a9a';
                ctx.fillRect(RIVER_X, 0, RIVER_WIDTH, 500);
            }
        }

        function drawPenguinOnly() {
            const p = penguin;
            const x = p.x, y = p.y;
            let img = null;

            if (p.state === 'idle') {
                const cycle = Math.floor(p.idleTimer / 180) % 4;
                if (cycle === 0) img = images.panhistade1;
                else if (cycle === 1) img = images.pangnafasdam;
                else if (cycle === 2) img = images.pannafasbazdam;
                else if (cycle === 3) img = images.pangistade2;
                if (!img) img = images.panhistade1;
                p.breathOffset = Math.sin(p.breath * Math.PI * 2) * 2;
            } 
            else if (p.state === 'walk') {
                if (keys.up) {
                    img = (p.frame % 2 === 0) ? images.pangghadamjolo1 : images.pangghadamjolo2;
                } else if (keys.down) {
                    img = (p.frame % 2 === 0) ? images.pangghadamposht1 : images.pangghadamposht2;
                    if (p.frame === 3) img = images.pangghadamposht3;
                } else {
                    img = (p.frame % 2 === 0) ? images.pangghdamrast1 : images.pangghadamrast2;
                }
                if (!img) img = images.pangghdamrast1;
            } 
            else if (p.state === 'fishing' || p.state === 'fishHold') {
                img = images.panhistade1;
                if (!img) img = images.pangistade2;
            }

            if (!img) {
                ctx.fillStyle = '#2a4a6a';
                ctx.fillRect(x-25, y-35, 50, 70);
                return;
            }

            ctx.save();
            const drawY = y + (p.breathOffset || 0);
            if (p.dir === 'left' && (keys.left || keys.right || p.state === 'walk')) {
                ctx.translate(x + 25, drawY - 35);
                ctx.scale(-1, 1);
                drawImageAspect(img, -25, 0, 50, 70);
            } else {
                drawImageAspect(img, x-25, drawY-35, 50, 70);
            }
            ctx.restore();
        }

        function drawRod() {
            const p = penguin;
            const x = p.x, y = p.y;
            let rodImg = null;
            let offsetKey = 'idle';
            let frameIndex = p.frame;

            if (p.state === 'fishing' || p.state === 'fishHold' || fishingState !== 'idle') {
                if (fishingState === 'casting' || fishingState === 'idle') {
                    rodImg = images.choob_amade;
                    offsetKey = 'fishing';
                } else if (fishingState === 'waiting' || fishingState === 'bite') {
                    rodImg = images.choob_partab;
                    offsetKey = 'fishing';
                } else if (fishingState === 'miniGame' || fishingState === 'reeling') {
                    rodImg = images.choob_too_ab;
                    offsetKey = 'fishHold';
                }
            } else {
                return;
            }

            if (!rodImg) return;

            let off;
            if (p.state === 'walk') {
                if (keys.up) off = p.rodOffsets.walkFront[frameIndex] || p.rodOffsets.walkFront[0];
                else if (keys.down) off = p.rodOffsets.walkBack[frameIndex] || p.rodOffsets.walkBack[0];
                else off = p.rodOffsets.walk[frameIndex] || p.rodOffsets.walk[0];
            } else {
                off = p.rodOffsets[offsetKey] || p.rodOffsets.idle;
            }

            let offX = off.x;
            let offY = off.y;

            if (p.dir === 'left') offX = -offX;

            // نوک چوب
            let tipX, tipY;
            if (p.dir === 'right') {
                tipX = x + offX + 30;
                tipY = y + offY - 5;
            } else {
                tipX = x - offX - 10;
                tipY = y + offY - 5;
            }

            // رسم بخش پشت چوب
            ctx.save();
            if (p.dir === 'left') {
                ctx.translate(x + offX + 5, y + offY - 15);
                ctx.scale(-1, 1);
                ctx.beginPath();
                ctx.rect(-10, 0, 20, 55);
                ctx.clip();
                drawImageAspect(rodImg, -20, 0, 55, 55);
            } else {
                ctx.beginPath();
                ctx.rect(x + offX - 5, y + offY - 5, 20, 55);
                ctx.clip();
                drawImageAspect(rodImg, x + offX - 5, y + offY - 5, 55, 55);
            }
            ctx.restore();

            // پنگوئن
            drawPenguinOnly();

            // بخش جلوی چوب
            ctx.save();
            if (p.dir === 'left') {
                ctx.translate(x + offX + 5, y + offY - 15);
                ctx.scale(-1, 1);
                ctx.beginPath();
                ctx.rect(20, 0, 25, 55);
                ctx.clip();
                drawImageAspect(rodImg, -20, 0, 55, 55);
            } else {
                ctx.beginPath();
                ctx.rect(x + offX + 15, y + offY - 5, 25, 55);
                ctx.clip();
                drawImageAspect(rodImg, x + offX - 5, y + offY - 5, 55, 55);
            }
            ctx.restore();

            // نخ و شناور
            if (fishingState === 'waiting' || fishingState === 'bite' || fishingState === 'miniGame') {
                const ballX = tipX + (p.dir === 'right' ? 25 : -25);
                const ballY = tipY + 35 + Math.sin(Date.now() / 400) * 5;
                bobberX = ballX;
                bobberY = ballY;

                // نخ با قوس
                ctx.beginPath();
                ctx.moveTo(tipX, tipY);
                const cpX = (tipX + ballX) / 2;
                const cpY = (tipY + ballY) / 2 - 10;
                ctx.quadraticCurveTo(cpX, cpY, ballX, ballY);
                ctx.strokeStyle = '#8a9aaa';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([3, 5]);
                ctx.stroke();
                ctx.setLineDash([]);

                // شناور
                if (images.toop) {
                    ctx.save();
                    const bobSize = 20 + Math.sin(Date.now() / 300) * 2;
                    drawImageAspect(images.toop, ballX-12, ballY-12 + Math.sin(Date.now() / 300) * 3, 24, 24);
                    ctx.restore();
                }

                // اگر ماهی گاز گرفته، افکت آبپاش
                if (fishingState === 'bite') {
                    ctx.save();
                    ctx.globalAlpha = 0.6;
                    for (let i = 0; i < 5; i++) {
                        const angle = Math.PI * 2 * (i / 5) + Date.now() / 500;
                        const dist = 15 + Math.sin(Date.now() / 200 + i) * 5;
                        ctx.beginPath();
                        ctx.arc(ballX + Math.cos(angle) * dist, ballY + Math.sin(angle) * dist, 4 + Math.sin(Date.now() / 150 + i) * 2, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,255,255,0.4)';
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }
        }

        function drawFishAndEffects() {
            const p = penguin;
            const x = p.x, y = p.y;

            if (p.holdingFish) {
                ctx.save();
                const exY = y - 65 + Math.sin(Date.now() / 250) * 6;
                ctx.font = '42px Arial';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#FFD700';
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 12;
                ctx.fillText('❗', x, exY);
                ctx.restore();

                if (images.mahi) {
                    ctx.save();
                    const fishOff = p.dir === 'right' ? p.fishOffsets.right : p.fishOffsets.left;
                    const fishX = x + fishOff.x;
                    const fishY = y + fishOff.y;
                    if (p.dir === 'left') {
                        ctx.translate(fishX + 16, fishY);
                        ctx.scale(-1, 1);
                        drawImageAspect(images.mahi, -16, -12, 32, 24);
                    } else {
                        drawImageAspect(images.mahi, fishX, fishY-12, 32, 24);
                    }
                    ctx.restore();
                }
            }
        }

        // ---------- مینی‌گیم ماهیگیری ----------
        function startMiniGame() {
            miniGameActive = true;
            miniGameFishY = Math.random() * 200 + 50;
            miniGameBarY = 150;
            miniGameSpeed = 1.5 + Math.random() * 1.5;
            miniGameDirection = Math.random() > 0.5 ? 1 : -1;
            miniGameScore = 0;
            miniGameMaxScore = 60 + Math.floor(Math.random() * 40);
            miniGameFishSize = 15 + Math.random() * 15;
            miniGameTimer = 0;
            miniGameSuccess = false;
            overlay.classList.add('active');
            fishingState = 'miniGame';
            statusDisplay.textContent = '🎣 مینی‌گام ماهیگیری!';
        }

        function updateMiniGame() {
            if (!miniGameActive) return;

            // حرکت ماهی
            miniGameFishY += miniGameSpeed * miniGameDirection;
            if (miniGameFishY < 20) { miniGameFishY = 20; miniGameDirection = 1; }
            if (miniGameFishY > 280) { miniGameFishY = 280; miniGameDirection = -1; }

            // حرکت نوار سبز با دکمه
            if (keys.up || keys.down) {
                if (keys.up) miniGameBarY -= 3;
                if (keys.down) miniGameBarY += 3;
            }
            miniGameBarY = Math.max(10, Math.min(290, miniGameBarY));

              // امتیاز (برخورد ماهی با نوار)
            const fishRect = { x: 30, y: miniGameFishY - miniGameFishSize/2, w: 140, h: miniGameFishSize };
            const barRect = { x: 30, y: miniGameBarY - 15, w: 140, h: 30 };
            if (fishRect.x < barRect.x + barRect.w &&
                fishRect.x + fishRect.w > barRect.x &&
                fishRect.y < barRect.y + barRect.h &&
                fishRect.y + fishRect.h > barRect.y) {
                miniGameScore++;
            } else {
                if (miniGameScore > 0) miniGameScore--;
            }

            miniGameTimer++;
            if (miniGameScore >= miniGameMaxScore) {
                miniGameSuccess = true;
                endMiniGame();
            }
            if (miniGameTimer > 600) { // 10 ثانیه
                endMiniGame();
            }
        }

        function endMiniGame() {
            miniGameActive = false;
            overlay.classList.remove('active');
            if (miniGameSuccess) {
                penguin.holdingFish = true;
                penguin.fishCount++;
                fishCountSpan.textContent = `🐟 ${penguin.fishCount}`;
                penguin.state = 'fishHold';
                fishingState = 'reeling';
                statusDisplay.textContent = '🐟 ماهی گرفتی!';
                setTimeout(() => {
                    if (penguin.holdingFish) {
                        penguin.holdingFish = false;
                        penguin.state = 'idle';
                        fishingState = 'idle';
                        statusDisplay.textContent = '🌊 ماهی رها شد';
                    }
                }, 3000);
            } else {
                statusDisplay.textContent = '😞 ماهی فرار کرد!';
                fishingState = 'idle';
                penguin.state = 'idle';
            }
        }

        function drawMiniGame() {
            miniCtx.clearRect(0, 0, 200, 300);
            // پس‌زمینه
            miniCtx.fillStyle = '#1a3a4a';
            miniCtx.fillRect(0, 0, 200, 300);
            
            // آب
            miniCtx.fillStyle = 'rgba(50, 100, 150, 0.3)';
            for (let i = 0; i < 10; i++) {
                const y = i * 30 + Math.sin(Date.now() / 500 + i) * 5;
                miniCtx.fillRect(0, y, 200, 15);
            }

            // نوار سبز
            miniCtx.fillStyle = '#4CAF50';
            miniCtx.shadowColor = '#8BC34A';
            miniCtx.shadowBlur = 10;
            miniCtx.fillRect(30, miniGameBarY - 15, 140, 30);
            miniCtx.shadowBlur = 0;

            // ماهی
            miniCtx.fillStyle = '#FF6B4A';
            miniCtx.beginPath();
            miniCtx.ellipse(100, miniGameFishY, miniGameFishSize, miniGameFishSize/2, 0, 0, Math.PI * 2);
            miniCtx.fill();
            miniCtx.fillStyle = '#fff';
            miniCtx.beginPath();
            miniCtx.arc(100 + miniGameFishSize/3, miniGameFishY - 3, 3, 0, Math.PI * 2);
            miniCtx.fill();

            // نوار پیشرفت
            const progress = miniGameScore / miniGameMaxScore;
            miniCtx.fillStyle = '#333';
            miniCtx.fillRect(20, 10, 160, 12);
            miniCtx.fillStyle = '#FFD700';
            miniCtx.fillRect(20, 10, 160 * Math.min(progress, 1), 12);
            
            // متن
            miniCtx.fillStyle = '#fff';
            miniCtx.font = '12px sans-serif';
            miniCtx.fillText(`پیشرفت: ${Math.floor(progress * 100)}%`, 20, 35);
        }

        // ---------- بروزرسانی ----------
        function update() {
            const p = penguin;

            p.breath += 0.003;
            if (p.breath > 1) p.breath = 0;

            if (p.state === 'idle') {
                p.idleTimer++;
                if (p.idleTimer > 720) p.idleTimer = 0;
            }

            // حرکت
            let mx = 0, my = 0;
            if (keys.left) mx = -2.5;
            if (keys.right) mx = 2.5;
            if (keys.up) my = -2.5;
            if (keys.down) my = 2.5;

            if ((mx !== 0 || my !== 0) && p.state !== 'fishing' && p.state !== 'fishHold' && !miniGameActive) {
                p.state = 'walk';
                p.idleTimer = 0;
                if (mx > 0) p.dir = 'right';
                else if (mx < 0) p.dir = 'left';
                p.frameTimer++;
                if (p.frameTimer > 7) {
                    p.frameTimer = 0;
                    p.frame = (p.frame + 1) % 4;
                }
                let newX = p.x + mx;
                let newY = p.y + my;
                newX = Math.max(30, Math.min(770, newX));
                newY = Math.max(30, Math.min(GROUND_Y-20, newY));

                const rect1 = { x: newX-25, y: newY-35, w: 50, h: 70 };
                const rect2 = RIVER_RECT;
                if (rect1.x < rect2.x + rect2.w &&
                    rect1.x + rect1.w > rect2.x &&
                    rect1.y < rect2.y + rect2.h &&
                    rect1.y + rect1.h > rect2.y) {
                    if (mx > 0) newX = RIVER_X - 30;
                    else if (mx < 0) newX = RIVER_X + RIVER_WIDTH + 30;
                    else {
                        if (my > 0) newY = rect2.y - 40;
                        else if (my < 0) newY = rect2.y + rect2.h + 10;
                    }
                }
                p.x = newX;
                p.y = newY;
            } else if (p.state !== 'fishing' && p.state !== 'fishHold' && !miniGameActive) {
                p.state = 'idle';
                p.frame = 0;
            }

            // ماهی‌گیری
            if (fishPressed && p.state !== 'fishing' && p.state !== 'fishHold' && !miniGameActive) {
                const dist = Math.abs(p.x - (RIVER_X + RIVER_WIDTH/2));
                if (dist < 80) {
                    startFishing();
                } else {
                    statusDisplay.textContent = '🚫 به رودخانه نزدیک شو!';
                }
                fishPressed = false;
            }

            // پروسه ماهی‌گیری
            if (fishingState === 'waiting') {
                p.castTimer++;
                if (p.castTimer > 80 && Math.random() < 0.01) {
                    fishingState = 'bite';
                    statusDisplay.textContent = '❗ ماهی گاز گرفت!';
                    setTimeout(() => {
                        if (fishingState === 'bite') {
                            startMiniGame();
                        }
                    }, 800);
                }
                if (p.castTimer > 400) {
                    fishingState = 'idle';
                    p.state = 'idle';
                    statusDisplay.textContent = '🌊 دوباره امتحان کن';
                }
            }

            if (p.state === 'fishHold' && !p.holdingFish) {
                p.state = 'idle';
                fishingState = 'idle';
            }

            // مینی‌گیم
            if (miniGameActive) {
                updateMiniGame();
            }
        }

        function startFishing() {
            const p = penguin;
            p.state = 'fishing';
            fishingState = 'casting';
            p.castTimer = 0;
            p.holdingFish = false;
            statusDisplay.textContent = '🎣 چوب انداختن...';
            setTimeout(() => {
                if (p.state === 'fishing') {
                    fishingState = 'waiting';
                    statusDisplay.textContent = '⏳ منتظر ماهی...';
                }
            }, 1000);
        }

        // ---------- حلقه اصلی ----------
        function gameLoop() {
            update();
            ctx.clearRect(0, 0, 800, 500);
            
            drawBackground();
            drawRiver();
            drawRod();
            drawFishAndEffects();

            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(10, 10, 160, 28);
            ctx.fillStyle = '#fff';
            ctx.font = '13px sans-serif';
            ctx.fillText(`حالت: ${penguin.state}`, 16, 30);

            if (miniGameActive) {
                drawMiniGame();
            }

            animId = requestAnimationFrame(gameLoop);
        }

        // ---------- رویدادها ----------
        function setupEvents() {
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case 'ArrowLeft': keys.left = true; e.preventDefault(); break;
                    case 'ArrowRight': keys.right = true; e.preventDefault(); break;
                    case 'ArrowUp': keys.up = true; e.preventDefault(); break;
                    case 'ArrowDown': keys.down = true; e.preventDefault(); break;
                    case 'f': case 'F': fishPressed = true; e.preventDefault(); break;
                }
            });
            document.addEventListener('keyup', (e) => {
                switch(e.key) {
                    case 'ArrowLeft': keys.left = false; e.preventDefault(); break;
                    case 'ArrowRight': keys.right = false; e.preventDefault(); break;
                    case 'ArrowUp': keys.up = false; e.preventDefault(); break;
                    case 'ArrowDown': keys.down = false; e.preventDefault(); break;
                }
            });

            const btns = {
                leftBtn: 'left', rightBtn: 'right', upBtn: 'up', downBtn: 'down'
            };
            for (const [id, key] of Object.entries(btns)) {
                const btn = document.getElementById(id);
                if (!btn) continue;
                const start = (e) => { e.preventDefault(); keys[key] = true; };
                const end = (e) => { e.preventDefault(); keys[key] = false; };
                btn.addEventListener('mousedown', start);
                btn.addEventListener('mouseup', end);
                btn.addEventListener('mouseleave', end);
                btn.addEventListener('touchstart', start, { passive: false });
                btn.addEventListener('touchend', end, { passive: false });
                btn.addEventListener('touchcancel', end, { passive: false });
            }

            const fishBtn = document.getElementById('fishBtn');
            if (fishBtn) {
                fishBtn.addEventListener('click', () => { fishPressed = true; });
                fishBtn.addEventListener('touchstart', (e) => { e.preventDefault(); fishPressed = true; }, { passive: false });
            }

            document.getElementById('miniGameBtn').addEventListener('mousedown', () => { keys.up = true; });
            document.getElementById('miniGameBtn').addEventListener('mouseup', () => { keys.up = false; });
            document.getElementById('miniGameBtn').addEventListener('mouseleave', () => { keys.up = false; });
            document.getElementById('miniGameBtn').addEventListener('touchstart', (e) => { e.preventDefault(); keys.up = true; });
            document.getElementById('miniGameBtn').addEventListener('touchend', (e) => { e.preventDefault(); keys.up = false; });
        }

        // ---------- شروع ----------
        async function init() {
            const promises = imageList.map(([name, src]) => loadImage(name, src));
            await Promise.all(promises);
            console.log('✅ همه تصاویر بار شدند');
            statusDisplay.textContent = '🌊 بازی شروع شد!';
            setupEvents();
            gameLoop();
        }

        init();
    })();
</script>
</body>
</html>

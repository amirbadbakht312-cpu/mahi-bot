<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>بازی پنگوئن</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            margin: 0; padding: 0; overflow: hidden;
            background: #0a0a15; height: 100vh;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #gameContainer { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; position: absolute; top: 0; left: 0; }
        #settingsBtn {
            position: absolute; top: 15px; left: 15px;
            width: 36px; height: 36px;
            background: rgba(30, 30, 50, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: white; z-index: 1000;
            transition: all 0.2s;
        }
        #settingsBtn:hover { background: rgba(50, 50, 80, 0.9); }
        #settingsPanel {
            position: absolute; top: 15px; left: 60px;
            background: rgba(20, 20, 40, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px; padding: 12px;
            color: white; z-index: 999; min-width: 230px;
            display: none; font-size: 11px;
        }
        #settingsPanel.active { display: block; }
        #settingsPanel h3 {
            margin: 0 0 10px 0; font-size: 13px;
            text-align: center; color: #00d2ff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 7px;
        }
        .setting-group { margin-bottom: 10px; }
        .setting-group label {
            display: block; margin-bottom: 4px; font-size: 10px;
            color: rgba(255, 255, 255, 0.65); font-weight: bold;
        }
        .radio-group { display: flex; gap: 5px; flex-direction: column; }
        .radio-option {
            display: flex; align-items: center; gap: 5px;
            cursor: pointer; padding: 5px 8px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 5px; font-size: 10px;
        }
        .radio-option:hover { background: rgba(255, 255, 255, 0.08); }
        .radio-option input[type="radio"] {
            appearance: none; width: 14px; height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%; cursor: pointer; flex-shrink: 0;
            position: relative;
        }
        .radio-option input[type="radio"]:checked {
            border-color: #00d2ff; background: rgba(0, 210, 255, 0.2);
        }
        .radio-option input[type="radio"]:checked::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 6px; height: 6px; background: #00d2ff; border-radius: 50%;
        }
        input[type="range"] {
            width: 100%; height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px; outline: none; -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px;
            background: #00d2ff; border-radius: 50%; cursor: pointer;
        }
        .range-value { text-align: center; margin-top: 2px; font-size: 9px; color: rgba(255,255,255,0.45); }
        #setPositionBtn {
            width: 100%; padding: 6px;
            background: rgba(0, 210, 255, 0.12);
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 5px; color: #00d2ff; font-size: 10px;
            cursor: pointer; margin-top: 6px;
        }
        #setPositionBtn:hover { background: rgba(0, 210, 255, 0.2); }
        .position-info { text-align: center; margin-top: 4px; font-size: 9px; color: rgba(255,255,255,0.45); }
        #confirmPositionBtn {
            position: absolute; bottom: 25px; left: 50%;
            transform: translateX(-50%); padding: 8px 25px;
            background: rgba(0, 210, 255, 0.85); border: none;
            border-radius: 18px; color: white; font-size: 12px;
            font-weight: bold; cursor: pointer; z-index: 1001;
            display: none; box-shadow: 0 3px 12px rgba(0, 210, 255, 0.25);
        }
        #confirmPositionBtn:hover { background: rgba(0, 210, 255, 0.95); }
        #dragHint {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7); color: white;
            padding: 7px 14px; border-radius: 14px;
            font-size: 11px; z-index: 1001; display: none; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <button id="settingsBtn" title="تنظیمات">&#9881;</button>
        <div id="settingsPanel">
            <h3>تنظیمات کنترل</h3>
            <div class="setting-group">
                <label>حالت کنترل:</label>
                <div class="radio-group" id="controlModeGroup">
                    <label class="radio-option">
                        <input type="radio" name="controlMode" value="joystick" checked>
                        <span>دایره کنترل (جوی‌استیک)</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="controlMode" value="click">
                        <span>کلیک و حرکت به سمت هدف</span>
                    </label>
                </div>
            </div>
            <div class="setting-group" id="joystickSettings">
                <label>اندازه دایره کنترل:</label>
                <input type="range" id="joystickSize" min="40" max="150" value="60" step="5">
                <div class="range-value" id="sizeValue">60px</div>
                <label>موقعیت دایره:</label>
                <button id="setPositionBtn">بکش و رها کن روی صفحه</button>
                <div class="position-info" id="positionInfo">
                    X: <span id="posX">100</span>, Y: <span id="posY">وسط</span>
                </div>
            </div>
        </div>
        <button id="confirmPositionBtn">تایید موقعیت</button>
        <div id="dragHint">دایره رو بکش هرجا خواستی، بعد تایید کن</div>
    </div>

    <script src="js/assetManager.js"></script>
    <script src="js/world.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/player.js"></script>
    <script src="js/joystick.js"></script>
    <script src="js/minimap.js"></script>
    <script src="js/game.js"></script>
    
    <script>
        (function() {
            const STORAGE_KEY_CONTROL = 'penguin_control_mode';
            const STORAGE_KEY_JOY_SIZE = 'penguin_joystick_size';
            const STORAGE_KEY_JOY_X = 'penguin_joystick_x';
            const STORAGE_KEY_JOY_Y = 'penguin_joystick_y';

            const settingsBtn = document.getElementById('settingsBtn');
            const settingsPanel = document.getElementById('settingsPanel');
            const joystickSettings = document.getElementById('joystickSettings');
            const controlModeRadios = document.querySelectorAll('input[name="controlMode"]');
            const joystickSizeSlider = document.getElementById('joystickSize');
            const sizeValue = document.getElementById('sizeValue');
            const setPositionBtn = document.getElementById('setPositionBtn');
            const confirmPositionBtn = document.getElementById('confirmPositionBtn');
            const dragHint = document.getElementById('dragHint');
            const posXSpan = document.getElementById('posX');
            const posYSpan = document.getElementById('posY');
            
            let dragHintTimeout = null;

            function safeCall(fnName, ...args) {
                if (typeof window[fnName] === 'function') {
                    return window[fnName](...args);
                }
                return null;
            }

            function loadSettings() {
                const savedMode = localStorage.getItem(STORAGE_KEY_CONTROL) || 'joystick';
                const savedJoySize = localStorage.getItem(STORAGE_KEY_JOY_SIZE) || '60';
                const savedJoyX = localStorage.getItem(STORAGE_KEY_JOY_X) || '100';
                const savedJoyY = localStorage.getItem(STORAGE_KEY_JOY_Y) || 'center';

                controlModeRadios.forEach(radio => {
                    radio.checked = radio.value === savedMode;
                });

                joystickSettings.style.display = savedMode === 'joystick' ? 'block' : 'none';
                joystickSizeSlider.value = savedJoySize;
                sizeValue.textContent = savedJoySize + 'px';
                posXSpan.textContent = savedJoyX;
                posYSpan.textContent = savedJoyY === 'center' ? 'وسط' : savedJoyY;
                
                // اعمال تنظیمات به بازی با تاخیر برای اطمینان از لود game.js
                setTimeout(() => {
                    safeCall('setControlMode', savedMode);
                    safeCall('setJoystickSize', parseInt(savedJoySize));
                    
                    const joyY = savedJoyY === 'center' ? window.innerHeight / 2 : parseInt(savedJoyY);
                    safeCall('setJoystickPosition', parseInt(savedJoyX), joyY);
                }, 200);
            }

            function saveModeAndSize() {
                const mode = document.querySelector('input[name="controlMode"]:checked')?.value || 'joystick';
                const size = joystickSizeSlider.value;
                localStorage.setItem(STORAGE_KEY_CONTROL, mode);
                localStorage.setItem(STORAGE_KEY_JOY_SIZE, size);
            }

            function togglePanel() {
                settingsPanel.classList.toggle('active');
            }

            function closePanel() {
                settingsPanel.classList.remove('active');
            }

            // دکمه تنظیمات
            settingsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                togglePanel();
            });

            // کلیک بیرون پنل
            document.addEventListener('click', (e) => {
                if (!settingsPanel.contains(e.target) && e.target !== settingsBtn) {
                    closePanel();
                }
            });

            // بستن با ESC
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && settingsPanel.classList.contains('active')) {
                    closePanel();
                }
            });

            // جلوگیری از بسته شدن با کلیک داخل پنل
            settingsPanel.addEventListener('click', (e) => {
                e.stopPropagation();
            });

            // تغییر حالت کنترل
            controlModeRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    const mode = e.target.value;
                    joystickSettings.style.display = mode === 'joystick' ? 'block' : 'none';
                    saveModeAndSize();
                    safeCall('setControlMode', mode);
                });
            });

            // تغییر اندازه جوی‌استیک
            joystickSizeSlider.addEventListener('input', (e) => {
                const size = e.target.value;
                sizeValue.textContent = size + 'px';
                saveModeAndSize();
                safeCall('setJoystickSize', parseInt(size));
            });

            // دکمه تنظیم موقعیت
            setPositionBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                closePanel();
                confirmPositionBtn.style.display = 'block';
                dragHint.style.display = 'block';
                
                if (dragHintTimeout) clearTimeout(dragHintTimeout);
                dragHintTimeout = setTimeout(() => {
                    dragHint.style.display = 'none';
                }, 3000);
                
                safeCall('startDraggingPosition');
                
                // بروزرسانی موقعیت حین درگ
                const posInterval = setInterval(() => {
                    if (confirmPositionBtn.style.display === 'none') {
                        clearInterval(posInterval);
                        return;
                    }
                    const pos = safeCall('getJoystickPosition');
                    if (pos) {
                        posXSpan.textContent = Math.round(pos.x);
                        posYSpan.textContent = Math.round(pos.y);
                    }
                }, 100);
            });

            // دکمه تأیید موقعیت
            confirmPositionBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                confirmPositionBtn.style.display = 'none';
                dragHint.style.display = 'none';
                
                if (dragHintTimeout) {
                    clearTimeout(dragHintTimeout);
                    dragHintTimeout = null;
                }
                
                safeCall('confirmPosition');
                
                const pos = safeCall('getJoystickPosition');
                if (pos) {
                    const x = Math.round(pos.x);
                    const y = Math.round(pos.y);
                    posXSpan.textContent = x;
                    posYSpan.textContent = y;
                    localStorage.setItem(STORAGE_KEY_JOY_X, x.toString());
                    localStorage.setItem(STORAGE_KEY_JOY_Y, y.toString());
                }
                
                settingsPanel.classList.add('active');
            });

            // لود تنظیمات ذخیره شده
            loadSettings();
        })();
    </script>
</body>
</html>

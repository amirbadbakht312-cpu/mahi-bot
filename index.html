<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>بازی کنترل مربع</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // وضعیت مربع (بازیکن)
        const player = {
            size: 40,
            x: 0,
            y: 0,
            speed: 5
        };

        // تنظیم موقعیت اولیه در وسط صفحه
        function setInitialPosition() {
            player.x = canvas.width / 2 - player.size / 2;
            player.y = canvas.height / 2 - player.size / 2;
        }
        setInitialPosition();
        window.addEventListener('resize', setInitialPosition);

        // وضعیت جوی‌استیک
        const joystick = {
            radius: 60,
            centerX: 0,
            centerY: 0,
            active: false,
            dx: 0,
            dy: 0,
            maxDist: 50
        };

        function updateJoystickPosition() {
            joystick.centerX = joystick.radius + 40;
            joystick.centerY = canvas.height / 2;
        }
        updateJoystickPosition();
        window.addEventListener('resize', updateJoystickPosition);

        // ----- کنترل‌های یکپارچه ماوس و لمسی -----
        let mouseIsDown = false;

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startControl(e) {
            e.preventDefault();
            const { x, y } = getCanvasCoords(e);
            const distToCenter = Math.hypot(x - joystick.centerX, y - joystick.centerY);
            
            if (distToCenter <= joystick.radius) {
                joystick.active = true;
                updateJoystickValues(x, y);
            }
        }

        function moveControl(e) {
            e.preventDefault();
            if (!joystick.active) return;
            const { x, y } = getCanvasCoords(e);
            updateJoystickValues(x, y);
        }

        function endControl(e) {
            e.preventDefault();
            joystick.active = false;
            joystick.dx = 0;
            joystick.dy = 0;
        }

        function updateJoystickValues(x, y) {
            let dx = x - joystick.centerX;
            let dy = y - joystick.centerY;
            const distance = Math.hypot(dx, dy);
            
            if (distance > joystick.maxDist) {
                const angle = Math.atan2(dy, dx);
                dx = Math.cos(angle) * joystick.maxDist;
                dy = Math.sin(angle) * joystick.maxDist;
            }
            
            joystick.dx = dx;
            joystick.dy = dy;
        }

        // رویدادهای ماوس (اصلاح‌شده)
        canvas.addEventListener('mousedown', (e) => {
            mouseIsDown = true;
            startControl(e);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!mouseIsDown) return;
            moveControl(e);
        });

        window.addEventListener('mouseup', () => {
            mouseIsDown = false;
            endControl(new Event('mouseup'));
        });

        // رویدادهای لمسی
        canvas.addEventListener('touchstart', startControl, { passive: false });
        canvas.addEventListener('touchmove', moveControl, { passive: false });
        canvas.addEventListener('touchend', endControl);
        canvas.addEventListener('touchcancel', endControl);

        // ----- حلقه بازی -----
        function update() {
            if (joystick.active) {
                const intensity = Math.min(1, Math.hypot(joystick.dx, joystick.dy) / joystick.maxDist);
                const angle = Math.atan2(joystick.dy, joystick.dx);
                
                player.x += Math.cos(angle) * player.speed * intensity;
                player.y += Math.sin(angle) * player.speed * intensity;
            }

            // محدود کردن مربع به صفحه
            player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // رسم مربع بازیکن (حالا از وسط شروع می‌شود)
            ctx.fillStyle = '#00d2ff';
            ctx.shadowColor = '#00d2ff';
            ctx.shadowBlur = 15;
            ctx.fillRect(player.x, player.y, player.size, player.size);
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            
            // رسم دایره کنترلر
            ctx.beginPath();
            ctx.arc(joystick.centerX, joystick.centerY, joystick.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // رسم نقطه مرکزی جوی‌استیک
            if (joystick.active) {
                const stickX = joystick.centerX + joystick.dx;
                const stickY = joystick.centerY + joystick.dy;
                
                ctx.beginPath();
                ctx.arc(stickX, stickY, 25, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.arc(joystick.centerX, joystick.centerY, 20, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fill();
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
